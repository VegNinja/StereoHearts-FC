
name: Sync StereoHearts EA data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stereohearts-ea-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Supabase connection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import socket
          from urllib.parse import urlparse

          url = os.environ.get("SUPABASE_URL", "").strip()
          parsed = urlparse(url)
          host = parsed.hostname

          print("HTTPS enabled:", parsed.scheme == "https")
          print("Hostname:", host)

          if not host:
              raise ValueError("Supabase URL has no hostname")

          print("DNS resolution:", socket.gethostbyname(host))
          print("Supabase hostname resolved successfully")
          PY

      - name: Fetch EA data and save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_ea.py
